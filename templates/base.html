<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102a43">
    <title>{% block title %}ProofPath AI{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ url_for('home') }}" aria-label="ProofPath AI home">
          <span class="brand-mark" aria-hidden="true">P</span>
          <span>ProofPath <span class="brand-light">AI</span></span>
        </a>
        <span class="header-note">Career readiness, made practical</span>
      </div>
    </header>

    <main id="main-content" class="page-shell">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <p>ProofPath AI helps you turn internship requirements into portfolio evidence.</p>
    </footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
